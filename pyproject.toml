[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "newsletter-agent"
version = "1.0.0"
description = "An autonomous LangGraph agent that researches, writes, critiques and 'sends' a weekly AI-agents newsletter."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Devesh", email = "devesh.nix@gmail.com" }]
dependencies = [
    "langgraph>=1.0",
    "langchain>=1.0",
    "langchain-core>=1.0",
    "langchain-anthropic>=1.0",
    "langchain-openai>=1.0",
    "langchain-google-genai>=3.0",
    "langchain-ollama>=1.0",
    "langchain-xai>=1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "feedparser>=6.0",
    "trafilatura>=2.0",
    "jinja2>=3.1",
    "rich>=13.7",
    "streamlit>=1.64",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
newsletter-agent = "newsletter_agent.cli:main"

[tool.setuptools.packages.find]
include = ["newsletter_agent*"]

[tool.setuptools.package-data]
newsletter_agent = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM905"]
